name: Task-set fast preparation

# Additive feedback, not replacement CI or queue admission.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fast:
    name: openrepotools-pr-fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install the existing runner pin
        run: 'python3 -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.3.4'
      - name: Verify exact test-merge checkout (no API token)
        run: python3 .github/ci/delivery_verify.py fast
      - name: Parse the scoped component
        run: bash -n claude-current
      - name: Scoped regression, guard/hygiene and delivery contracts
        run: bash tests/run.sh -k 'claude_current or guard_launch_mode or repo_hygiene or ci_delivery'

