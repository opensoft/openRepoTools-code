name: verify

# ONE SELECTOR OF THE SUITE, ON GITHUB'S RUNNER, FOR A LANE'S BRANCH
# (opensoft/openRepoTools#165). A lane's local `tests/run.sh` waits while any
# `python3 -m pytest` runs anywhere on its workstation, and on 2026-11-10 a
# task's verify waited an hour there and timed out without running. Brett
# Heap chose "CI verifies (Recommended)": "Lane 3 briefs every lane to verify
# on CI by default. Local runs shrink to one short test by node id." This is
# where a lane verifies.
#
# IT IS NOT A GATE. `tests.yml` is the required check and the release gate,
# and this file changes nothing in it: the release workflow reads only the
# runs whose path is `.github/workflows/tests.yml`.
#
# HOW A RUN IS ASKED FOR. Two triggers, one job:
#
#   * A PUSH TO A BRANCH UNDER `verify/`, named `verify/<lane>/<task>`. The
#     run reads what to run from the HEAD COMMIT's trailers, the last
#     paragraph of its message, as `git` reads trailers:
#
#         Verify-Selector: <one pytest -k expression>   required, once
#         Verify-Postgres: 1                            optional; 0 or absent is off
#
#     A push runs the workflow file of the commit pushed, so this works on any
#     branch that carries this file, before the file is on `main`. The branch
#     is deleted once its run is read.
#   * `workflow_dispatch`, ONCE THIS FILE IS ON `main` (GitHub dispatches only
#     a workflow on the default branch), on any ref, with the inputs
#     `selector` and `postgres`; the commit's trailers are not read then.
#
# The run is `bash tests/run.sh -k "$SELECTOR" -rs --junitxml=…`, never under
# a `flock`: the wrapper takes its own lock, and on a runner of its own it
# waits for nothing. `-rs` prints each skip's reason, since a skip a person
# cannot read is a skip nobody audits; the JUnit report is what the summary
# counts. The run's output is the artifact `verify-<run id>-a<attempt>`, and
# the step summary is one line: the selector, PostgreSQL on or off, and the
# passed, failed and skipped counts.
#
# NOTHING A COMMIT MESSAGE OR AN INPUT SAYS REACHES A SHELL AS CODE. No `run:`
# below holds an expression: every value from the event comes in through
# `env:` and is used double-quoted. The selector is refused unless it is
# pytest's `-k` alphabet (letters, digits, `_`, space, `.`, `(`, `)`, `[`,
# `]`, `:`, `+`, `/`, `-`), begins with a letter, a digit, `_` or `(`, and is
# at most 4096 bytes (a task's own selector in spec#17's tasks.md runs to
# 1,438). So it reaches pytest as one argument, never as an option,
# and can carry no quote, `$`, backtick or newline, begin no workflow command,
# and leave no code span of the summary. A refused value is printed `%q`-quoted.
on:
  push:
    branches: ['verify/**']
  workflow_dispatch:
    inputs:
      selector:
        description: 'A pytest -k expression, as tests/run.sh -k takes it'
        required: true
        type: string
      postgres:
        description: '1 installs PostgreSQL 16 and requires the real-engine tests; 0 makes them skip'
        required: true
        default: '0'
        type: choice
        options: ['0', '1']

# LEAST PRIVILEGE: nothing for the workflow, `contents: read` for the job's
# checkout, and no secret anywhere. The checkout keeps no credential
# (`persist-credentials: false`): the suite never touches the network, and
# the code a lane pushes runs here.
permissions: {}

# ONE LIVE RUN PER VERIFY BRANCH: a newer push to the same branch cancels the
# older run, whose commit is no longer the branch's. A dispatch is a group of
# its own and never cancels another run.
concurrency:
  group: "verify-${{ github.event_name == 'push' && github.ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    # `bash --noprofile --norc -eo pipefail`, in every step.
    shell: bash

# THE CHECKOUT CONTEXT, as `tests.yml` names it (#186, T010): the code root is
# the checkout's own root, and the run is standalone, not composed.
env:
  OPENREPOTOOLS_CODE_ROOT: "${{ github.workspace }}"
  OPENREPOTOOLS_COMPOSED: '0'

jobs:
  verify:
    # `ubuntu-24.04`, as every job in `tests.yml` and for its reason:
    # `ubuntu-latest` became Ubuntu 26.04 on 2026-10-21, where setup-python
    # has no Python 3.9 and a kill test fails. The engine that runs today is
    # the one the runner image carries, PGDG's build of PostgreSQL 16
    # (`16.15-1.pgdg24.04+2` on 2026-11-11, which the install step below found
    # already newest). Ubuntu 24.04's own default major is 16 too, so if the
    # image ever drops it, the install falls back to `postgresql-16` from
    # Ubuntu's archive. This job adds no PGDG source.
    runs-on: ubuntu-24.04
    # The whole suite takes 58 to 81 minutes serial, and a task's selector is
    # far less. A hung pytest would otherwise hold the runner for 360.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # PINNED BY COMMIT, the same two commits `tests.yml` pins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      # WHAT TO RUN, read and checked once. The steps after it read this
      # step's three outputs and nothing else from the event.
      #
      # POSTGRESQL OFF IS OFF. The runner image carries PostgreSQL 16 at
      # `/usr/lib/postgresql/16/bin`, where `tests/pgcluster.py` (lane 2's,
      # T229) would find it unasked. A named `PG_BIN` is final there ("a named
      # PG_BIN is never replaced by a found one"), so off names an empty
      # directory, as lane 2's own `no_engine()` does: the real-engine tests
      # skip, naming `PG_BIN` and `postgresql-16`, and a lane that meant to
      # run them reads why under `-rs` and asks again with `Verify-Postgres: 1`.
      - name: what to run (the head commit's trailers, or the dispatch's inputs)
        id: plan
        env:
          DISPATCH_SELECTOR: "${{ inputs.selector }}"
          DISPATCH_POSTGRES: "${{ inputs.postgres }}"
        run: |
          set -euo pipefail
          export LC_ALL=C
          out="$RUNNER_TEMP/verify"
          mkdir -p "$out"
          refuse() {
            printf '::error::%s\n' "$1"
            printf 'refused: %s\n' "$1" >> "$out/plan.txt"
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            from="the dispatch's inputs"
            selector="$DISPATCH_SELECTOR"
            postgres="$DISPATCH_POSTGRES"
          else
            from="the trailers of $GITHUB_SHA"
            selector="$(git log -1 --format='%(trailers:key=Verify-Selector,valueonly,unfold)' HEAD)"
            postgres="$(git log -1 --format='%(trailers:key=Verify-Postgres,valueonly,unfold)' HEAD)"
          fi
          if [ -z "$selector" ]; then
            refuse "$from give no selector: a Verify-Selector trailer in the head commit's last paragraph, or the input selector. A run takes one pytest -k expression and has no default; the whole suite is tests.yml's."
          fi
          case "$selector" in
            *$'\n'*) refuse "$from give a selector of more than one line (a Verify-Selector trailer given twice, or an input holding a line break): $(printf '%q' "$selector")" ;;
          esac
          alphabet='^[A-Za-z0-9_(][][A-Za-z0-9_ .():+/-]*$'
          if [ "${#selector}" -gt 4096 ] || ! [[ $selector =~ $alphabet ]]; then
            refuse "the selector $(printf '%q' "$selector") is refused: it is at most 4096 bytes of letters, digits and _ .()[]:+/- and spaces, beginning with a letter, a digit, _ or ("
          fi
          case "$postgres" in
            ''|0)
              postgres=0
              pg_bin="$RUNNER_TEMP/no-postgresql"
              mkdir -p "$pg_bin"
              ;;
            1) pg_bin=/usr/lib/postgresql/16/bin ;;
            *) refuse "$from give PostgreSQL as $(printf '%q' "$postgres"): Verify-Postgres, or the input postgres, is 1 (on) or 0 (off), given once" ;;
          esac
          {
            printf 'selector=%s\n' "$selector"
            printf 'postgres=%s\n' "$postgres"
            printf 'pg_bin=%s\n' "$pg_bin"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'commit:   %s\n' "$GITHUB_SHA"
            printf 'ref:      %s\n' "$GITHUB_REF"
            printf 'from:     %s\n' "$from"
            printf 'selector: %s\n' "$selector"
            printf 'postgres: %s (PG_BIN %s)\n' "$postgres" "$pg_bin"
          } | tee -a "$out/plan.txt"

      # POSTGRESQL 16, ONLY WHEN ASKED FOR. Today this installs nothing: the
      # runner image carries PGDG's build of PostgreSQL 16, and apt finds it
      # already newest, so that build is what runs. The step keeps the job from
      # depending on the image: if the image drops it, `postgresql-16` comes
      # from Ubuntu 24.04's archive, whose default major is 16.
      # NO SERVICE CONTAINER AND NO SYSTEM SERVICE: `tests/pgcluster.py` runs
      # `initdb` and a postmaster of its own as the runner's user, on a Unix
      # socket under `/tmp` (and T229's TLS cluster on 127.0.0.1 at a free
      # port), and needs only the binaries.
      - name: install PostgreSQL 16's server binaries
        if: ${{ steps.plan.outputs.postgres == '1' }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends postgresql-16

      # THE ENGINE STARTS, before the suite is asked to use it: the four tools
      # the fixture needs each say major 16, and a cluster of this step's own
      # starts on a socket alone, answers, and stops.
      - name: PostgreSQL 16 starts, and pg_ctl --version says 16
        if: ${{ steps.plan.outputs.postgres == '1' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verify"
          bindir=/usr/lib/postgresql/16/bin
          for tool in initdb pg_ctl postgres psql; do
            said="$("$bindir/$tool" --version)"
            printf '%s\n' "$said" | tee -a "$out/postgresql.txt"
            case "$said" in
              *'(PostgreSQL) 16.'*) ;;
              *)
                printf '::error::%s/%s --version said "%s", not PostgreSQL 16\n' "$bindir" "$tool" "$said"
                exit 1
                ;;
            esac
          done
          root="$(mktemp -d /tmp/verify-pg.XXXXXX)"
          if ! "$bindir/initdb" -D "$root/data" -N -A trust -U verify -E UTF8 --locale=C > "$out/initdb.log" 2>&1; then
            cat "$out/initdb.log"
            echo "::error::initdb of PostgreSQL 16 failed"
            exit 1
          fi
          printf "listen_addresses = ''\nunix_socket_directories = '%s'\n" "$root" >> "$root/data/postgresql.conf"
          if ! "$bindir/pg_ctl" -D "$root/data" -l "$out/server.log" -w -t 60 start; then
            cat "$out/server.log"
            echo "::error::PostgreSQL 16 did not start"
            exit 1
          fi
          version="$("$bindir/psql" -X -A -t -h "$root" -U verify -d postgres -c 'SHOW server_version;')"
          "$bindir/pg_ctl" -D "$root/data" -m fast -w stop
          printf 'server_version %s\n' "$version" | tee -a "$out/postgresql.txt"
          case "$version" in
            16.*) ;;
            *)
              echo "::error::the server answered server_version '$version', not 16"
              exit 1
              ;;
          esac

      # pytest is the test runner and the only thing installed, at the pin
      # `tests.yml` installs, wheels only.
      - name: install the test runner
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.3.4

      # THE RUN. The fixture reads exactly two variables, and both are set
      # here and nowhere else: `OPENREPOTOOLS_REQUIRE_PG` (`1` refuses a run
      # that finds no engine, pytest's exit 4, before any test) and `PG_BIN`.
      # The identity is per invocation, as in `tests.yml`, for the fixtures'
      # commits.
      - name: the suite, this selector
        env:
          SELECTOR: "${{ steps.plan.outputs.selector }}"
          OPENREPOTOOLS_REQUIRE_PG: "${{ steps.plan.outputs.postgres }}"
          PG_BIN: "${{ steps.plan.outputs.pg_bin }}"
          GIT_AUTHOR_NAME: openRepoTools CI
          GIT_AUTHOR_EMAIL: ci@openrepotools.invalid
          GIT_COMMITTER_NAME: openRepoTools CI
          GIT_COMMITTER_EMAIL: ci@openrepotools.invalid
        run: |
          out="$RUNNER_TEMP/verify"
          set +e
          bash tests/run.sh -k "$SELECTOR" -rs --junitxml="$out/junit.xml" 2>&1 | tee "$out/run.log"
          status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "$status" > "$out/exit-code"
          exit "$status"

      # ONE LINE: the selector, PostgreSQL on or off, and the counts, each
      # test case read as `.github/ci/ci_shards.py` reads one (an error, else
      # a failure, else a skip, else a pass). The selector holds no backtick,
      # so it cannot leave its code span.
      - name: the summary line
        if: ${{ always() && steps.plan.outcome != 'skipped' }}
        env:
          SELECTOR: "${{ steps.plan.outputs.selector }}"
          POSTGRES: "${{ steps.plan.outputs.postgres }}"
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/verify" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ElementTree
          from pathlib import Path

          out = Path(sys.argv[1])
          selector = os.environ.get("SELECTOR", "")
          postgres = {"1": "on", "0": "off"}.get(os.environ.get("POSTGRES", ""), "not read")
          code_file, junit = out / "exit-code", out / "junit.xml"
          code = code_file.read_text(encoding="utf-8").strip() if code_file.is_file() else ""
          head = f"verify `{selector}` at {os.environ['GITHUB_SHA'][:12]}, PostgreSQL {postgres}"
          if not selector:
              line = (f"verify: nothing ran at {os.environ['GITHUB_SHA'][:12]}: the step "
                      "`what to run` refused what it was asked, and its log says why")
          elif not code:
              line = f"{head}: the suite did not run (a step before it failed)"
          elif not junit.is_file():
              line = f"{head}: pytest exited {code} and wrote no report"
          else:
              # ONE OUTCOME PER TEST CASE, `.github/ci/ci_shards.py`'s rule:
              # an xfail is counted as skipped and an xpass as passed, and a
              # test that passes and then errors in teardown counts only as
              # an error, where pytest's own line says "1 passed, 1 error".
              # The suite has no xfail today.
              counts = {"passed": 0, "failed": 0, "skipped": 0, "error": 0}
              for case in ElementTree.parse(str(junit)).getroot().iter("testcase"):
                  outcome = "passed"
                  for tag, name in (("error", "error"), ("failure", "failed"),
                                    ("skipped", "skipped")):
                      if case.find(tag) is not None:
                          outcome = name
                          break
                  counts[outcome] += 1
              said = (f"{counts['passed']} passed, {counts['failed']} failed, "
                      f"{counts['skipped']} skipped")
              if counts["error"]:
                  said += f", {counts['error']} error" + ("s" if counts["error"] != 1 else "")
              note = " (no test was selected)" if code == "5" else ""
              line = f"{head}: {said}; exit {code}{note}"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          PY

      - name: keep the run's output
        if: ${{ always() && steps.plan.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verify-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify/
          if-no-files-found: error
          retention-days: 14
