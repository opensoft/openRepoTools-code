# Configuration only: no canary, review labels or queue commands in this PR.
# Manual queue entry is separate from the advisory ci-pilot classifier.
merge_queue:
  mode: serial
  max_parallel_checks: 1
  queue_controls_comment: false
  reset_on_external_merge: always
  skip_intermediate_results: false

commands_restrictions:
  queue:
    conditions:
      - sender-permission>=write

queue_rules:
  - name: openrepotools-docs-pilot
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - label=batch-pilot-reviewed
      - 'head~=^ci/batch-pilot/[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
      - or:
          - base=main
          - and:
              - 'base~=^ci/batch-pilot/[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
              - 'body~=(?m)^Depends-On: #[1-9][0-9]*[ \t\r]*$'
      - '#files>=1'
      - '#files<=2'
      - '-files~=^(?![.]github/ci/(task-set-delivery|batching-pilot)[.]md\Z)'
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package
    merge_conditions:
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package

  # One user-authorized real-code batch, not a general lane queue.
  # The operator verifies these exact reviewed heads before requesting queue:
  # #35 447b51b93d762d2b89ae1bd175811d1907010ca2
  # #36 63a47bdcc98ebb63bb253ea2e2d449d94eb4bdba
  # These comments are receipts, not service-enforced SHA conditions.
  - name: openrepotools-real-code-35-36
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - base=main
      - or:
          - and:
              - number=35
              - head=fix/exit-refusals-keep-their-words
              - '#files=2'
              - files=lane-handoff
              - files=tests/test_a23_lane_handoff.py
              - '-files~=^(?!(lane-handoff|tests/test_a23_lane_handoff[.]py)\Z)'
          - and:
              - number=36
              - head=fix/a14-three-nudge-race
              - '#files=1'
              - files=tests/test_lane_helpers.sh
              - '-files~=^(?!tests/test_lane_helpers[.]sh\Z)'
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package
    merge_conditions:
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package

  # General manual entry for reviewed independent code PRs; never auto-enqueue.
  # The writer verifies exact-head Codex review and merge authority before the
  # named command. This is operator attestation, not a service-enforced SHA gate.
  - name: openrepotools-code
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - base=main
      - 'head~=^(?!release/|verify/|mergify/|ci/batch-pilot/)[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
      - '#files>=1'
      - -files=src/openrepotools/_release.py
      - '-files~=^(?!(?:(?:claude-current|claude-restart-check|lane|lane-end|lane-handoff|lane-rename|lane-start|lane-worktrees|lanes|lanes-edit[.]sh|lanes-index|link-estates|openRepoTools|park|resume|status|repos[.]tsv|README[.]md)|(?:tests|src|commands|skills|features)/[A-Za-z0-9_.+/-]+)\Z)'
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package
    merge_conditions:
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package

  # Prepared, writer-requested scope only. Disabled routing retains all full
  # checks. Never set injection to none/merge to evade branch protection.
  - name: openrepotools-claude-current
    branch_protection_injection_mode: queue
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - base=main
      - 'head~=^(?!main\Z|release/|verify/|mergify/)[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
      - 'body~=(?m)^CI-Shadow: claude-current[ \t\r]*$'
      - 'body~=(?m)^CI-Delivery: claude-current[ \t\r]*$'
      - '-body~=(?m)^Depends-On:'
      - '#files>=1'
      - '#files<=2'
      - '-files~=^(?!(claude-current|tests/test_claude_current[.]py)\Z)'
      - check-success=@github-actions/openrepotools-pr-fast
      - check-success=@github-actions/openrepotools-delivery
    merge_conditions:
      - check-success=@github-actions/openrepotools-batch-heavy

  # Reviewed initial test-only scope. Entry is manual, exact-head consent is
  # separate, and the queue cannot merge without complete trusted heavy proof.
  - name: openrepotools-sql-register-v13
    branch_protection_injection_mode: queue
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - base=main
      - 'head~=^(?!main\Z|release/|verify/|mergify/)[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
      - 'body~=(?m)^CI-Shadow: sql-register-v13[ \t\r]*$'
      - 'body~=(?m)^CI-Delivery: sql-register-v13[ \t\r]*$'
      - 'body~=(?m)^CI-Task-Set: P(?:05|06)[ \t\r]*$'
      - '-body~=(?im)^[ \t]*Depends-On:'
      - '#files>=2'
      - '#files<=6'
      - '-files~=^(?!(?:tests/test_sql_register_[a-z_]+[.]py|tests/sql_register_landed/T[0-9]{3})\Z)'
      - check-success=@github-actions/openrepotools-pr-fast
      - check-success=@github-actions/openrepotools-delivery
    merge_conditions:
      - check-success=@github-actions/openrepotools-batch-heavy

  # Manual exact-pair canary. These service filters do not prove SHA or order;
  # the trusted-main candidate gate rejects every non-P07-then-P09 batch.
  - name: openrepotools-sql-register-p07-p09
    branch_protection_injection_mode: queue
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - base=main
      - '-body~=(?im)^[ \t]*Depends-On:'
      - or:
          - and:
              - number=97
              - head=007-p07-render-writes-shape-divergence-rollback-2
              - '#files=15'
              - '-files~=^(?!(?:tests/fixtures/lanes-edit-v1[.]1[.]0/SHA256SUMS|tests/fixtures/lanes-edit-v1[.]1[.]0/lanes-edit[.]sh|tests/sql_register_cleanup[.]py|tests/test_sql_register_divergence[.]py|tests/test_sql_register_render[.]py|tests/test_sql_register_renderer_git[.]py|tests/test_sql_register_rollback[.]py|tests/test_sql_register_shape[.]py|tests/test_sql_register_writes[.]py|tests/sql_register_landed/T210|tests/sql_register_landed/T240|tests/sql_register_landed/T241|tests/sql_register_landed/T270|tests/sql_register_landed/T271|tests/sql_register_landed/T273)\Z)'
          - and:
              - number=103
              - head=007-p09-guard-measure-writes-disaster-drill-rollback
              - '#files=30'
              - '-files~=^(?!(?:tests/conftest[.]py|tests/pgcluster[.]py|tests/test_sql_register_bounds[.]py|tests/test_sql_register_disaster[.]py|tests/test_sql_register_drill[.]py|tests/test_sql_register_fixture[.]py|tests/test_sql_register_guard[.]py|tests/test_sql_register_landing_expired[.]py|tests/test_sql_register_managed[.]py|tests/test_sql_register_measure[.]py|tests/test_sql_register_outage[.]py|tests/sql_register_landed/T213|tests/sql_register_landed/T214|tests/sql_register_landed/T215|tests/sql_register_landed/T219|tests/sql_register_landed/T220|tests/sql_register_landed/T224|tests/sql_register_landed/T226|tests/sql_register_landed/T229|tests/sql_register_landed/T230|tests/sql_register_landed/T237|tests/sql_register_landed/T253|tests/sql_register_landed/T254|tests/sql_register_landed/T255|tests/sql_register_landed/T257|tests/sql_register_landed/T258|tests/sql_register_landed/T274|tests/sql_register_landed/T276|tests/sql_register_landed/T278|tests/sql_register_landed/T279)\Z)'
      - check-success=@github-actions/openrepotools-pr-fast
      - check-success=@github-actions/openrepotools-delivery
    merge_conditions:
      - check-success=@github-actions/openrepotools-batch-heavy
      - check-success=@sonarqubecloud/SonarCloud Code Analysis
