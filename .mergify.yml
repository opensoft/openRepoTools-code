# Configuration only: no canary, review labels or queue commands in this PR.
# Manual queue entry is separate from the advisory ci-pilot classifier.
merge_queue:
  mode: serial
  max_parallel_checks: 1
  queue_controls_comment: false
  reset_on_external_merge: always
  skip_intermediate_results: false

commands_restrictions:
  queue:
    conditions:
      - sender-permission>=write

queue_rules:
  - name: openrepotools-docs-pilot
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - label=batch-pilot-reviewed
      - 'head~=^ci/batch-pilot/[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
      - or:
          - base=main
          - and:
              - 'base~=^ci/batch-pilot/[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
              - 'body~=(?m)^Depends-On: #[1-9][0-9]*[ \t\r]*$'
      - '#files>=1'
      - '#files<=2'
      - '-files~=^(?![.]github/ci/(task-set-delivery|batching-pilot)[.]md\Z)'
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package
    merge_conditions:
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package

  # One user-authorized real-code batch, not a general lane queue.
  # The operator verifies these exact reviewed heads before requesting queue:
  # #35 447b51b93d762d2b89ae1bd175811d1907010ca2
  # #36 63a47bdcc98ebb63bb253ea2e2d449d94eb4bdba
  # These comments are receipts, not service-enforced SHA conditions.
  - name: openrepotools-real-code-35-36
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - base=main
      - or:
          - and:
              - number=35
              - head=fix/exit-refusals-keep-their-words
              - '#files=2'
              - files=lane-handoff
              - files=tests/test_a23_lane_handoff.py
              - '-files~=^(?!(lane-handoff|tests/test_a23_lane_handoff[.]py)\Z)'
          - and:
              - number=36
              - head=fix/a14-three-nudge-race
              - '#files=1'
              - files=tests/test_lane_helpers.sh
              - '-files~=^(?!tests/test_lane_helpers[.]sh\Z)'
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package
    merge_conditions:
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package

  # General manual entry for reviewed independent code PRs; never auto-enqueue.
  # The writer verifies exact-head Codex review and merge authority before the
  # named command. This is operator attestation, not a service-enforced SHA gate.
  - name: openrepotools-code
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - base=main
      - 'head~=^(?!release/|verify/|mergify/|ci/batch-pilot/)[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
      - '#files>=1'
      - -files=src/openrepotools/_release.py
      - '-files~=^(?!(?:(?:claude-current|claude-restart-check|lane|lane-end|lane-handoff|lane-rename|lane-start|lane-worktrees|lanes|lanes-edit[.]sh|lanes-index|link-estates|openRepoTools|park|resume|status|repos[.]tsv|README[.]md)|(?:tests|src|commands|skills|features)/[A-Za-z0-9_.+/-]+)\Z)'
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package
    merge_conditions:
      - check-success=@github-actions/guard-launch-mode
      - check-success=@github-actions/tests
      - check-success=@github-actions/tests-no-submodule
      - check-success=@github-actions/package

  # Prepared, writer-requested scope only. Disabled routing retains all full
  # checks. Never set injection to none/merge to evade branch protection.
  - name: openrepotools-claude-current
    branch_protection_injection_mode: queue
    batch_size: 2
    batch_max_wait_time: 60 seconds
    batch_max_failure_resolution_attempts: 0
    max_checks_retries: 0
    checks_timeout: 90 minutes
    merge_method: merge
    queue_conditions:
      - -draft
      - -closed
      - -from-fork
      - base=main
      - 'head~=^(?!main\Z|release/|verify/|mergify/)[A-Za-z0-9][A-Za-z0-9._/-]*\Z'
      - 'body~=(?m)^CI-Shadow: claude-current[ \t\r]*$'
      - 'body~=(?m)^CI-Delivery: claude-current[ \t\r]*$'
      - '-body~=(?m)^Depends-On:'
      - '#files>=1'
      - '#files<=2'
      - '-files~=^(?!(claude-current|tests/test_claude_current[.]py)\Z)'
      - check-success=@github-actions/openrepotools-pr-fast
      - check-success=@github-actions/openrepotools-delivery
    merge_conditions:
      - check-success=@github-actions/openrepotools-batch-heavy
